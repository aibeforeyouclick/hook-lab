[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hook-lab"
version = "0.3.0"
description = "Find a channel's top short videos and analyse their first-5-second hooks, locally"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Before You Click" }]
keywords = ["youtube", "shorts", "hooks", "whisper", "yt-dlp", "video-analysis"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["yt-dlp[default]>=2026.8.19", "openai-whisper>=20250625"]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.4.4", "Pillow>=13.0.0"]

[project.urls]
Homepage = "https://github.com/aibeforeyouclick/hook-lab"
Issues = "https://github.com/aibeforeyouclick/hook-lab/issues"
Changelog = "https://github.com/aibeforeyouclick/hook-lab/blob/main/CHANGELOG.md"

[project.scripts]
hooklab = "hooklab.cli:main"

[tool.setuptools]
packages = ["hooklab"]
